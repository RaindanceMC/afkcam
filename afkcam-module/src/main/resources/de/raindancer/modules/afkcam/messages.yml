# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
afkcam:
  title: "<gradient:#F6B83D:#F2843A>✦ Away ✦</gradient>"
  subtitle: "<#6EC1EA>Any key brings you back"
  subtitle-preview: "<#6EC1EA>Any key ends it"
  bar: "<#6EC1EA>Away for <white><minutes></white> min <dark_gray>· <gray>any key brings you back"
  # While away, after the first seconds: a tip after this, one of the list below, a new one every 12 seconds.
  bar-tip: "<#6EC1EA>Away <white><minutes></white> min <dark_gray>· "
  # Empty this list to show no tips. About Hyades first; the last 50 are just for fun.
  tips:
    - "<gray>Use <white>/afkcam off</white> to stop the AFK camera taking over your view."
    - "<gray>Any movement key, jump, click or scroll ends the AFK camera at once."
    - "<gray><white>/chat private name</white> invites someone to a private chat."
    - "<gray><white>/chat public</white> talks in public again while you still read private."
    - "<gray>Type @name in chat to ping a player with a sound they will not miss."
    - "<gray><white>/chathistory 20</white> shows the last 20 chat lines, whenever you left."
    - "<gray>Public chat is shared with the other servers, tagged with the network tag."
    - "<gray>A name tag and a dye in a crafting grid give a name tag in that colour."
    - "<gray><white>/namestyle</white> lists what every item does; these recipes are hidden."
    - "<gray>Dye several tags around one plain tag to make a gradient name."
    - "<gray>Iron ingot toggles bold on a styled name tag, and a stick toggles italic."
    - "<gray>Coal darkens every colour on a styled tag, glowstone dust lightens them."
    - "<gray>A styled name tag stays styled for ever on this server, so choose with care."
    - "<gray><white>/pvp on</white> lets you fight others who have PvP on too."
    - "<gray>A claim owner who turns PvP off for a claim keeps that claim safe."
    - "<gray><white>/cosmetics particle shape spiral</white> draws your particle as a spiral."
    - "<gray><white>/cosmetics particle density dense</white> makes your particle thicker."
    - "<gray><white>/cosmetics clear all</white> takes off your name style and particle."
    - "<gray>Hold a weapon and type <white>/cosmetics skins</white> to skin it."
    - "<gray>Shift-click an entry on the Teleports page to pick nothing for that step."
    - "<gray>Open <white>/cosmetics</white> and choose Unlocks; each unlock is paid once."
    - "<gray><white>/link</white> in game gives a code to type as a slash command in Discord."
    - "<gray>Five wrong codes from one Discord account lock it out for ten minutes."
    - "<gray>Discord roles tied to groups here give you those groups while you hold them."
    - "<gray><white>/draftworld</white> takes a builder into the draft world, and back out."
    - "<gray><white>/auction sell 500 2000 5m</white> starts an auction, buy-it-now at 2000."
    - "<gray>A late bid extends the auction, so nobody can snipe in the last second."
    - "<gray>Banker wins pay even money, minus a commission on the winnings."
    - "<gray><white>/blackjack</white> opens the table for a hand."
    - "<gray>Double down gives exactly one more card, for double the stake."
    - "<gray><white>/withdraw amount cheque</white> writes a numbered cheque of any size."
    - "<gray>A cheque can be paid in only once; a second copy is taken and staff told."
    - "<gray><white>/casino</white> shows your balance, today's losses and a button per game."
    - "<gray>The daily loss limit counts from midnight, and a bet past it is refused."
    - "<gray><white>/coinflip name amount</white> challenges a player; nothing is staked yet."
    - "<gray>Set Cash out by itself at a multiplier to be paid there automatically."
    - "<gray>The dice screen shows what a win would pay before you roll."
    - "<gray><white>/daily</white> pays once per server day, and a streak adds a bonus."
    - "<gray><white>/bank sidebar</white> hides the richest list on screen, and back again."
    - "<gray><white>/baltop</white> lists the richest bank balances, not pocket cash."
    - "<gray><white>/fund name amount</white> donates; donations are destroyed for good."
    - "<gray>A card of the same rank loses either guess in Hi-Lo."
    - "<gray><white>/hire name wage 1h Miner</white> hires a player for a regular wage."
    - "<gray><white>/contract charge name amount 1w rent</white> proposes a weekly payment."
    - "<gray><white>/loan</white> shows the amounts you may borrow and the sum to repay."
    - "<gray><white>/lottery buy</white> gives quick-pick tickets, or add your own numbers."
    - "<gray><white>/mines</white> opens a 25-tile field; each safe tile raises your payout."
    - "<gray><white>/pay name 1.5k</white> sends money; shorthand like 1.5k and 2m works."
    - "<gray><white>/bill name amount reason</white> asks someone to pay you; say what for."
    - "<gray><white>/raffle start price</white> raffles the item in your hand."
    - "<gray><white>/giveaway start</white> gives the item in your hand away, one entry each."
    - "<gray><white>/repair</white> prices the held item; click within half a minute."
    - "<gray>A dozen pays about three to one at roulette, one number about 36 to one."
    - "<gray>Right-click a scratch card to scratch it; the prize is drawn at that moment."
    - "<gray><white>/season</white> lists your points from every season and the current one."
    - "<gray><white>/sell all</white> sells every item of one kind you carry."
    - "<gray><white>/sell enchantments</white> sells enchants off the item, keeping it."
    - "<gray>The Sell Wand sells everything the shop buys from a chest you right-click."
    - "<gray>Items with lore or hidden plugin data are not bought by the shop."
    - "<gray>Right-click a pack in your hand to unpack everything inside it."
    - "<gray><white>/shop search words</white> searches the whole shop and forgives typos."
    - "<gray>Selling back is always capped below the cheapest buy price, so loops lose."
    - "<gray>Two matching neighbours on the slots give your stake back."
    - "<gray>Withdrawing cash costs a percentage on top; paying cash back in is free."
    - "<gray><white>/treasury</white> shows how much money exists and where it is destroyed."
    - "<gray><white>/autopilot</white> with an Autopilot elytra takes off and holds cruise."
    - "<gray>Boost: click into the air while gliding for a dash, one charge per level."
    - "<gray>Flight chestplate: press jump twice to take off; time shows above the hotbar."
    - "<gray>Undying chestplate: click totems from your cursor onto it to keep them there."
    - "<gray>Fusion: two chestplates of one material in an anvil double the first's armour."
    - "<gray>A Night Vision helmet lets you see in the dark, with no particles on screen."
    - "<gray>Swiftness leggings give Speed I at level I and Speed II at level II."
    - "<gray>Soulbound keeps an item after death; each death uses up one level of it."
    - "<gray><white>/vein</white> switches Veinminer on or off for you, and it is remembered."
    - "<gray>Excavator breaks a 3x3 area in front of you; sneak to mine one block."
    - "<gray>Telekinesis puts drops in your inventory; what does not fit lands on the ground."
    - "<gray>Harvester hoe replants: level I hits one crop, II a 3x3, III a 5x5."
    - "<gray>Executioner adds damage against targets below thirty percent health."
    - "<gray>Thor: right-click an axe or mace to throw it like Mjolnir; it comes back."
    - "<gray><white>/heatseeking</white> switches heat-seeking between precise and wide aim."
    - "<gray>Against players, Overpower, Venom and Bleed count half; Thor is never halved."
    - "<gray><white>/enchants list</white> prints every Rain's enchantment and its top level."
    - "<gray>Thor and Reinforced never drop from ordinary monsters, only special ones."
    - "<gray>Build an obsidian portal frame and right-click inside it with a portal key."
    - "<gray>Spawner-made and bred monsters never drop shards; only a player's kill counts."
    - "<gray><white>/afk</white> marks you away at once; typing again or moving undoes it."
    - "<gray><white>/bugreport</white> asks what kind of problem, then where it happens."
    - "<gray>Clicking someone's existing report adds your +1 so the team sees how many."
    - "<gray><white>/joke</white> tells a deliberately terrible joke in your name in chat."
    - "<gray><white>/disenchant all</white> strips enchantments off, curses stay."
    - "<gray>After someone joins, a green Say Hi button under their join line greets them."
    - "<gray><white>/joinmusic off</white> stops the login music now and keeps it off."
    - "<gray><white>/msg name text</white> whispers to one player; only you two see it."
    - "<gray><white>/r message</white> answers whoever messaged you last during this visit."
    - "<gray><white>/ignore name</white> blocks someone's private messages to you."
    - "<gray><white>/nick name</white> sets a nickname with spaces and colours allowed."
    - "<gray><white>/nick clear</white> brings your real name back at once."
    - "<gray>Friends can still type your nickname to reach you in any command."
    - "<gray><white>/list</white> shows everybody online, on every server of the network."
    - "<gray><white>/seen name</white> says if someone is online, or when last seen."
    - "<gray><white>/players</white> lists every player the server has seen, online first."
    - "<gray><white>/rules 3</white> shows a single rule; <white>/rules</white> shows all."
    - "<gray>Moderators pick punishments from each rule's ladder, so the ladder applies."
    - "<gray>Right-click a Clear Sky token to chase rain away for a full Minecraft day."
    - "<gray><white>/spawn</white> sends you from anywhere; moving cancels a countdown."
    - "<gray><white>/claim show</white> draws your claim border around you for a while."
    - "<gray>Visitors to a claim see a big greeting title if the owner set one up."
    - "<gray><white>/claim ban name reason</white> bars someone, even while offline."
    - "<gray><white>/claim timeout name 2h</white> bars someone for a set time."
    - "<gray><white>/claim new</white> hands you the marking stick; two clicks mark a box."
    - "<gray>Right-click the air with the stick to turn the shape into a free outline."
    - "<gray><white>/claim trust name</white> lets a friend build, break and open chests."
    - "<gray>The trusted list gives single rights, one click each, out of seventeen."
    - "<gray>Left-click a claim flag to set it for everybody; right-click per audience."
    - "<gray><white>/claim</white> lists your claims and the claims where you are trusted."
    - "<gray><white>/fishing rod</white> shows your rod upgrades, earned with fishing XP."
    - "<gray>The Ember Line lets your float rest on lava like it does on water."
    - "<gray>Fishing spots bite sooner and bring rarer fish for a few minutes."
    - "<gray>Bait in your off hand is used up on each cast and changes what you catch."
    - "<gray><white>/guild ally tag</white> asks another guild to ally; both must agree."
    - "<gray><white>/guild rival tag</white> declares a rival; killing theirs earns XP."
    - "<gray><white>/guild deposit amount</white> pays money into the guild bank."
    - "<gray><white>/guild pay name amount</white> pays anyone from the bank, no daily limit."
    - "<gray><white>/guild oc message</white> talks to officers only, if you may."
    - "<gray><white>/guild shards add</white> pays in everything you carry the guild needs."
    - "<gray><white>/guild home</white> sends you to the guild home after a countdown."
    - "<gray><white>/guild level</white> shows your guild level and the XP to the next."
    - "<gray>Playing near guildmates earns a bonus for each one nearby, up to a cap."
    - "<gray><white>/guild list</white> shows every guild; click one to join or apply."
    - "<gray><white>/guild invite name</white> invites a player; the invite runs out in time."
    - "<gray><white>/guild promote name</white> moves a member one rank up the ladder."
    - "<gray><white>/guild leader name</white> hands the guild to a member; leaders only."
    - "<gray><white>/guild perks</white> spends the perk points your guild levels earned."
    - "<gray>Perk points can all be taken back on the guild perks page at once."
    - "<gray><white>/guild prestige</white> explains prestige; a top-level guild may restart."
    - "<gray><white>/guild create name tag</white> founds a guild, and you become its leader."
    - "<gray><white>/guild motd text</white> sets the message every member sees on joining."
    - "<gray>Anyone may put items in the guild vault; taking out needs a permission."
    - "<gray><white>/hp</white> toggles health bars on or off for you alone."
    - "<gray><white>/sethome name</white> saves a home here; reusing a name moves it."
    - "<gray><white>/home</white> with no name opens your homes as a menu."
    - "<gray>Arrival looks for solid ground near a home, so a mined-out floor is no fall."
    - "<gray>If you lose items, ask staff; they can restore one from your snapshot."
    - "<gray><white>/quests ask 50k 30m</white> asks for work paying that amount on a clock."
    - "<gray><white>/quests</white> shows today's personal quests, paid as each is done."
    - "<gray><white>/jobs</white> opens the server-wide job board with shared goals."
    - "<gray><white>/mannequin create</white> places a training dummy facing your way."
    - "<gray><white>/mannequin statue name</white> places a statue with that player's skin."
    - "<gray><white>/mannequin stats id</white> shows total damage, combos and average."
    - "<gray><white>/debt pay all</white> pays what you owe, as far as you can."
    - "<gray><white>/report name</white> opens a category menu; then say where and when."
    - "<gray>Name an animal with a name tag to keep it safe from staff thinning."
    - "<gray><white>/pets species</white> lists every pet species, from common to mythic."
    - "<gray><white>/pets call name</white> calls a pet out to fight beside you."
    - "<gray>Right-click your own pet to ride it; sneak to get off again."
    - "<gray>Pets gain levels from monsters they finish, and each level gives a skill point."
    - "<gray><white>/ping name</white> shows a ping even for someone who just left."
    - "<gray><white>/status</white> is your whole status card: health, hunger, playtime."
    - "<gray><white>/position</white> shows your world, coordinates, facing, chunk and biome."
    - "<gray><white>/prime</white> lists what Prime gives and when your subscription ends."
    - "<gray><white>/prime mapart</white> takes an https image link and a size in maps."
    - "<gray><white>/rtp</white> sends you to a random spot in the world you stand in."
    - "<gray><white>/rtp distance</white> sends you at least that far, for this trip only."
    - "<gray>Safe landing looks for solid natural ground, never a tree, roof or bridge."
    - "<gray><white>/rank wear name</white> picks which rank you wear in front of your name."
    - "<gray>Ranks stay with you for good; logging out or dying never takes them away."
    - "<gray><white>/rift</white> opens your personal storage, anywhere."
    - "<gray><white>/rift words</white> opens the rift already searching for those words."
    - "<gray>Shift-click an item in your inventory while the rift is open to put it in."
    - "<gray><white>/role</white> opens the list; a role gives shop perks and small bonuses."
    - "<gray><white>/send create name</white> opens a window to send up to 27 stacks."
    - "<gray><white>/market mine</white> lists your shops; click one to open its back room."
    - "<gray><white>/market statement</white> shows what your shops earned, spent and sold."
    - "<gray>Hang an item frame on a chest and write a [market] sign to open a shop."
    - "<gray>On the shop sign, a lone number is the sell price; B and S set each side."
    - "<gray><white>/market plot</white> claims the free plot you stand on."
    - "<gray>Plots rotate every few days, so everybody gets a turn near the square."
    - "<gray>Right-click a shop chest, sign or frame to open its trade counter."
    - "<gray><white>/market diamond</white> lists shops selling it, cheapest per item first."
    - "<gray>A dragon head brewed over a drinkable potion makes the Potion of Mach Fuck."
    - "<gray>The Wand of Magic Missiles has seven charges; sneak and right-click for three."
    - "<gray>The Potency skill makes your brewed potions last longer, sometimes stronger."
    - "<gray><white>/skills blueprint save name</white> saves the marked box nearby."
    - "<gray><white>/skills blueprint undo</white> takes your last paste down in ten minutes."
    - "<gray>Iron Stomach keeps rotten flesh and pufferfish from making you sick."
    - "<gray>Quick Undo breaks a block you placed in the last five seconds with one hit."
    - "<gray>Haggler lowers villager prices for you, and some emerald trades give one extra."
    - "<gray>Sneak and right-click an enchanting table with an empty hand for fresh offers."
    - "<gray>Crouch while digging with a Digger's shovel to take the soft blocks around too."
    - "<gray>Treasures come only from ground the world made, never from blocks you placed."
    - "<gray>Green Thumb replants a grown crop from its own seeds once you harvest it."
    - "<gray>Crops within six blocks of you grow faster while you are there."
    - "<gray>Bloom makes bone meal grow a sapling, berry bush or stem all the way at once."
    - "<gray>Lucky Strike makes ores drop twice over; coal does so about half the time."
    - "<gray>Vein Miner: crouch while breaking an ore to take its whole vein with it."
    - "<gray>Master Smith caps anvil work at 39 levels, so nothing is too expensive."
    - "<gray>Crouch and use a tool on an anvil to salvage it, after you confirm."
    - "<gray>A bone, fish or seeds fed to an animal may tame it on the first try."
    - "<gray>Windrider: a horse you ride never takes fall damage."
    - "<gray><white>/skills</white> opens every skill and its tree; click a node to learn it."
    - "<gray>Second Wind heals a third of your health when you drop below a third."
    - "<gray>Timber: crouch while chopping a log to fell the rest of that tree with it."
    - "<gray>Replanter: chop a tree's lowest log and a sapling is planted in its place."
    - "<gray>Every adventurer level is one skill point, spent in any skill's tree."
    - "<gray>Your hero saves to the server every few seconds and when you leave."
    - "<gray><white>/back</white> takes you to where you were before your last teleport."
    - "<gray>After dying, <white>/back</white> takes you to where your body and items lie."
    - "<gray><white>/tpa name</white> asks someone whether you may come to them."
    - "<gray><white>/tpahere name</white> asks someone to teleport to you instead."
    - "<gray><white>/tptoggle</white> stops teleport requests without telling askers why."
    - "<gray><white>/tpahere @a</white> asks every player who can be asked, and counts them."
    - "<gray><white>/voicebridge join</white> puts you in the group bridged to Discord voice."
    - "<gray><white>/voicebridge link</white> gives a code for Discord, valid ten minutes."
    - "<gray><white>/voicebridge invite name</white> sends a Join button, good five minutes."
    - "<gray><white>/warp set name</white> sets a warp where you stand."
    - "<gray><white>/warp fee name amount</white> charges visitors to your warp each visit."
    - "<gray><white>/warp list</white> prints the warps as text you can paste to a friend."
    - "<gray>A warp has a short warm-up, and moving cancels the trip."
    - "<gray><white>/worldgate status</white> shows whether the Nether and End are open."
    - "<gray>A drained dimension lets people out but not in, so come back once it reopens."
    - "<gray>Smithing tables can trim your elytra, with the pattern in its colour."
    - "<gray>Every horse armour takes a trim at a smithing table, like your own armour."
    - "<gray><white>/elytra look none</white> removes the chestplate look from your elytra."
    - "<gray>Hold dog armour and type <white>/elytra dog</white> for a netherite or diamond look. Prime."
    - "<gray>Prime looks come off when Prime ends. Trims always stay."
    - "<gray>The Nether opens three days after launch, the End a week after."
    - "<gray>A countdown and a title tell everyone online when the Nether or End opens."
    - "<gray>Your first visit to the Nether or the End after it opens comes with its own music."
    - "<gray><white>/prime mapart</white> turns any picture into map art. Prime only."
    - "<gray>Weapon skins are a Prime perk: <white>/cosmetics skins</white> with a weapon in hand."
    - "<gray>Prime statues honour our supporters. Yours could be one of them."
    - "<gray>Voice chat works by distance: whisper near friends, shout across the field."
    - "<gray>The world border is 5000 blocks from spawn. Plenty of room to settle."
    - "<gray>Server restarts are announced in chat. Find somewhere safe when you see it."
    # ---- just for fun
    - "<gray>The AFK camera films you better than you ever filmed yourself."
    - "<gray>Your guild tag sits in front of your name, a permanent signature."
    - "<gray>The casino never sleeps, and neither does your bank balance after that bet."
    - "<gray>A loyal pet is worth more than any shop price, and it never asks for a refund."
    - "<gray>Dig deeper than your wallet and you will find a chest that just says no."
    - "<gray>A rainbow name tag is still just a name tag with big ambitions."
    - "<gray>Your rift keeps everything except your excuses, which stay in your head."
    - "<gray>Mannequins never complain about damage, unlike your guildmates in a boss fight."
    - "<gray>The Sell Wand sells stuff, not your dignity, and the shop knows it."
    - "<gray>Nobody in the shard world has ever asked a monster for an autograph."
    - "<gray>Coin flip is fair in theory and a cry for help in practice."
    - "<gray>The lottery pot grows like the to-do list of your guild."
    - "<gray>Your horse wears a trim better than you wear a tie."
    - "<gray>A dog in full netherite armour is still a dog that wants a walk."
    - "<gray>Veinminer mines diamonds, not your regrets."
    - "<gray>Telekinesis is the only thing on this server that does your chores for you."
    - "<gray><white>/afk</white> is the only command where doing nothing counts as progress."
    - "<gray>The bank statement is long, but your excuses are longer."
    - "<gray>Mach Fuck is a potion name only a dragon head could love."
    - "<gray>The Potion of Healing has never once healed a bad joke."
    - "<gray>Your ping is high because the hamsters are running, obviously."
    - "<gray>Roast yourself, then pay the bill with a cheque, very dramatically."
    - "<gray>A cheque is a fancy note, but nobody was ever paid in compliments."
    - "<gray>Four-leaf clovers are rare, mythic pets are rarer, good excuses are rarest."
    - "<gray>The Wand of Magic Missiles misses the point, and sometimes the mob too."
    - "<gray>Golden name tags do not make you richer; ask the lottery."
    - "<gray>Hugging a claim border is free, but the fence hugs back."
    - "<gray>The rift and the cheese fridge have one thing in common: both keep things away."
    - "<gray>A gift sent with <white>/send create</white> still needs an Accept button."
    - "<gray>Raffles are a tax on hope with a drumroll attached."
    - "<gray>The auction house sells almost everything, but not your pride."
    - "<gray>The job board is a board, not a bench; nobody ever sat on it."
    - "<gray>The guild home is cosy, but the guild bank still prefers quiet."
    - "<gray>Hi-Lo is a bet on the next card and a bet on your mood."
    - "<gray>The crash round does not care how long you stared at the number."
    - "<gray>Your AFK farm works harder during your nap than you do all day."
    - "<gray>Seasons come and go, your rank tag stays, and your secrets never leave."
    - "<gray>A pig with a name tag is still a pig, just a more famous one."
    - "<gray>If you read every tip you will still die to lava, somehow, every time."
    - "<gray>Your pet will love you unconditionally, which the shop price list never does."
    - "<gray>Every auction ends eventually, unlike the queue for your first bid."
    - "<gray>Hi-Lo, like life, has no cash-out button for bad decisions."
    - "<gray>Your mannequin has taken more hits than your last group chat."
    - "<gray>Crystal Wardens do not need a warning, they need a hug."
    - "<gray>The AFK farm has never once asked for a holiday."
    - "<gray>Your fishing net is a fishing bag, which is an unnecessary word for a sack."
    - "<gray>The rift is tidier than people, says the rift, which is not a person."
    - "<gray>The shard world is darker than your last shopping receipt."
    - "<gray>Pro tip: pressing any key brings you back. You knew that."
    - "<gray>Breaking news: local player stands still. More at 11."
  bar-preview: "<#6EC1EA>Preview <dark_gray>· <gray>any key ends it"
  back: "<#6EC1EA>Welcome back."
  switched-on: "<green>Your AFK camera is on. Once you are away, it shows you from calm still angles until you press a key."
  switched-off: "<yellow>Your AFK camera is off. Being away changes nothing on your screen now."
  status-on: "<gray>Your AFK camera is <green>on</green>. <white>/afkcam</white> switches it, <white>/afkcam preview</white> shows it."
  status-music: "<gray>Playing now: <white><track></white>."
  status-off: "<gray>Your AFK camera is <yellow>off</yellow>. <white>/afkcam</white> switches it, <white>/afkcam preview</white> shows it."
  preview-off: "<red>The AFK camera is switched off on this server."
  preview-unsupported: "<red>This server cannot move your camera right now."
  preview-spectating: "<red>Spectators have a camera of their own."
  preview-hurt: "<red>Not while you are getting hurt. Find somewhere calm first."
  preview-not-permitted: "<red>You may not use the AFK camera."
  only-a-player: "<red>Only a player has a camera."
  usage: "<gray>/afkcam <dark_gray>— switch it · <gray>/afkcam on | off | status · /afkcam preview <dark_gray>— see it now"
